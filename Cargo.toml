[package]
name = "gevo"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
name = "gevo"
path = "src/main.rs"

[dependencies]
dirs = "5"
eframe = "0.37"
egui = { version = "0.37", features = ["serde"] }
keyring = "4"
russh = { version = "0.65.0", default-features = false, features = ["ring", "flate2", "rsa"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
strum = { version = "0.27", features = ["derive"] }
thiserror = "2"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "io-util", "time"] }
toml = "0.8"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
typesense = "0.4"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1"

[dev-dependencies]
mockall = "0.13"
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros"] }
