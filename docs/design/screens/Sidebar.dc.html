<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gevo sidebar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<nav aria-label="Main" style="box-sizing: border-box; width: 100%; min-height: 800px; display: flex; flex-direction: column; gap: 20px; padding: 14px 12px 16px; background: {{t.bg}}; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: {{t.text}}; font-size: 13px">
  <div style="display: flex; align-items: center; gap: 8px; padding: 2px 6px">
    <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><rect x="1" y="1" width="16" height="16" rx="3" fill="none" stroke="{{t.accent}}" stroke-width="1.6"></rect><path d="M5 9h8M9 5v8" stroke="{{t.accent}}" stroke-width="1.6"></path></svg>
    <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-weight: 600; font-size: 15px; letter-spacing: 0.02em">gevo</span>
  </div>

  <sc-if value="{{connected}}" hint-placeholder-val="{{ true }}">
    <button type="button" aria-label="Switch connection: prod-search" style="display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 10px; border-radius: 8px; border: 1px solid {{t.switchBorder}}; background: {{t.switchBg}}; color: {{t.text}}; cursor: pointer; text-align: left; font: inherit">
      <span style="width: 8px; height: 8px; border-radius: 50%; background: {{t.ok}}; flex: none"></span>
      <span style="display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1">
        <span style="font-weight: 600">prod-search</span>
        <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 11px; color: {{t.muted}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">via SSH · bastion-1</span>
      </span>
      <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M4 5.5l3 3 3-3" fill="none" stroke="{{t.muted}}" stroke-width="1.5"></path></svg>
    </button>
  </sc-if>
  <sc-if value="{{offline}}" hint-placeholder-val="{{ false }}">
    <button type="button" aria-label="Choose a connection" style="display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 10px; border-radius: 8px; border: 1px dashed {{t.switchBorder}}; background: transparent; color: {{t.text}}; cursor: pointer; text-align: left; font: inherit">
      <span style="width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid {{t.muted}}; box-sizing: border-box; flex: none"></span>
      <span style="display: flex; flex-direction: column; gap: 2px; flex: 1">
        <span style="font-weight: 600">No active connection</span>
        <span style="font-size: 11px; color: {{t.muted}}">Pick a profile to connect</span>
      </span>
      <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M4 5.5l3 3 3-3" fill="none" stroke="{{t.muted}}" stroke-width="1.5"></path></svg>
    </button>
  </sc-if>

  <div style="display: flex; flex-direction: column; gap: 2px">
    <span style="padding: 0 10px 6px; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: {{t.label}}">Server</span>
    <sc-if value="{{connected}}" hint-placeholder-val="{{ true }}">
      <a href="Collections.dc.html" style="display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border-radius: 6px; text-decoration: none; background: {{nav.collections.bg}}; color: {{nav.collections.fg}}">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><ellipse cx="8" cy="4" rx="5.5" ry="2" fill="none" stroke="{{nav.collections.icon}}" stroke-width="1.4"></ellipse><path d="M2.5 4v8c0 1.1 2.5 2 5.5 2s5.5-.9 5.5-2V4M2.5 8c0 1.1 2.5 2 5.5 2s5.5-.9 5.5-2" fill="none" stroke="{{nav.collections.icon}}" stroke-width="1.4"></path></svg>
        <span style="flex: 1">Collections</span>
        <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 11px; color: {{t.muted}}">6</span>
      </a>
      <a href="ApiKeys.dc.html" style="display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border-radius: 6px; text-decoration: none; background: {{nav.keys.bg}}; color: {{nav.keys.fg}}">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="5" cy="8" r="3" fill="none" stroke="{{nav.keys.icon}}" stroke-width="1.4"></circle><path d="M8 8h6.5M12 8v2.5M14 8v2" fill="none" stroke="{{nav.keys.icon}}" stroke-width="1.4"></path></svg>
        <span style="flex: 1">API keys</span>
        <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 11px; color: {{t.muted}}">5</span>
      </a>
      <a href="Health.dc.html" style="display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border-radius: 6px; text-decoration: none; background: {{nav.health.bg}}; color: {{nav.health.fg}}">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 8.5h3l2-5 3 9 2-4h3" fill="none" stroke="{{nav.health.icon}}" stroke-width="1.4" stroke-linejoin="round"></path></svg>
        <span style="flex: 1">Health</span>
        <span style="width: 7px; height: 7px; border-radius: 50%; background: {{t.ok}}"></span>
      </a>
    </sc-if>
    <sc-if value="{{offline}}" hint-placeholder-val="{{ false }}">
      <span aria-disabled="true" style="display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; color: {{t.disabled}}">Collections</span>
      <span aria-disabled="true" style="display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; color: {{t.disabled}}">API keys</span>
      <span aria-disabled="true" style="display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; color: {{t.disabled}}">Health</span>
      <span style="padding: 6px 10px 0; font-size: 11px; line-height: 1.45; color: {{t.label}}">Connect to a server to use these.</span>
    </sc-if>
  </div>

  <sc-if value="{{connected}}" hint-placeholder-val="{{ true }}">
    <div style="display: flex; flex-direction: column; gap: 1px">
      <span style="padding: 0 10px 6px; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: {{t.label}}">Collections</span>
      <sc-for list="{{collections}}" as="c" hint-placeholder-count="6">
        <a href="Documents.dc.html" style="display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 10px; border-radius: 6px; text-decoration: none; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; background: {{c.bg}}; color: {{c.fg}}">
          <span style="flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{c.name}}</span>
          <span style="font-size: 11px; color: {{t.label}}">{{c.count}}</span>
        </a>
      </sc-for>
    </div>
  </sc-if>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 2px; border-top: 1px solid {{t.border}}; padding-top: 12px">
    <a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border-radius: 6px; text-decoration: none; background: {{nav.connections.bg}}; color: {{nav.connections.fg}}">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 2v3M10 2v3M4 5h8v3a4 4 0 01-8 0V5zM8 12v2.5" fill="none" stroke="{{nav.connections.icon}}" stroke-width="1.4"></path></svg>
      <span>Connections</span>
    </a>
    <a href="Settings.dc.html" style="display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border-radius: 6px; text-decoration: none; background: {{nav.settings.bg}}; color: {{nav.settings.fg}}">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2.2" fill="none" stroke="{{nav.settings.icon}}" stroke-width="1.4"></circle><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4" stroke="{{nav.settings.icon}}" stroke-width="1.4"></path></svg>
      <span>Settings</span>
    </a>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["connections","collections","documents","keys","health","settings"],"default":"collections"},"activeCollection":{"editor":"text","default":""},"connected":{"editor":"boolean","default":true},"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"accent":{"editor":"enum","options":["amber","blue","green","violet"],"default":"amber"},"$preview":{"width":232,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'collections';
    const conn = this.props.connected ?? true;
    const ac = this.props.activeCollection ?? '';
    const theme = this.props.theme === 'light' ? 'light' : 'dark';
    const accents = {
      amber: { dark: '#E8A33D', light: '#A8650F' },
      blue: { dark: '#6EA8FE', light: '#2F64C8' },
      green: { dark: '#5FC08A', light: '#23804D' },
      violet: { dark: '#B394F5', light: '#6C46C9' }
    };
    const accent = (accents[this.props.accent] || accents.amber)[theme];
    const base = theme === 'light'
      ? { bg: '#F3F2EE', border: '#DDDBD4', text: '#1D1D1B', muted: '#67655F', label: '#6B6963', switchBg: '#FFFFFF', switchBorder: '#D3D1CA', activeBg: '#E4E2DB', activeFg: '#111110', idleFg: '#3A3935', iconIdle: '#67655F', colIdle: '#4A4945', disabled: '#A3A19A', ok: '#23804D' }
      : { bg: '#16171A', border: '#2C2E33', text: '#E7E5E0', muted: '#9A9890', label: '#8F8D86', switchBg: '#1E2024', switchBorder: '#34363C', activeBg: '#26282D', activeFg: '#FFFFFF', idleFg: '#CFCDC6', iconIdle: '#9A9890', colIdle: '#B9B7AF', disabled: '#6E6C66', ok: '#6CCB94' };
    const t = { ...base, accent };
    const on = { bg: t.activeBg, fg: t.activeFg, icon: accent };
    const off = { bg: 'transparent', fg: t.idleFg, icon: t.iconIdle };
    const pick = (k) => (k === active ? on : off);
    const cols = [
      ['products', '48.2k'], ['articles', '9.8k'], ['users_v2', '120.5k'],
      ['geo_places', '3.2k'], ['support_tickets', '0'], ['embeddings_demo', '2.0k']
    ].map(([name, count]) => ({
      name, count,
      bg: name === ac ? t.activeBg : 'transparent',
      fg: name === ac ? t.activeFg : t.colIdle
    }));
    return {
      t,
      connected: conn,
      offline: !conn,
      collections: cols,
      nav: {
        collections: (active === 'collections' || active === 'documents') ? on : off,
        keys: pick('keys'),
        health: pick('health'),
        connections: pick('connections'),
        settings: pick('settings')
      }
    };
  }
}
</script>
</body>
</html>
